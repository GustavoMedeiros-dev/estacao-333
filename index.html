<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Estação 3:33</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07060d; --ink:#f1e6c8; --muted:#a9a3c9; --accent:#e8b04a; --box:rgba(14,12,26,.94); --line:#5b4d7d;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#07060d; } }
:root[data-theme="dark"]{ --bg:#07060d; }
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--bg);display:flex;align-items:center;justify-content:center;overflow:hidden;
  font-family:'VT323',ui-monospace,Menlo,Consolas,monospace;color:var(--ink);
  user-select:none;-webkit-user-select:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
#game{position:relative;--s:3}
canvas{position:relative;display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
#coverArt{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:center bottom;background:#0d0f1c;image-rendering:pixelated;pointer-events:none;-webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 12%);mask-image:linear-gradient(to bottom,transparent 0,#000 12%)}
/* eixo da capa: o centro do relógio da estação fica a 48,5% da largura; título, subtítulo e botão se alinham a ele */
#menu{--axis:48.5%}
.overlay{position:absolute;inset:0;pointer-events:none}
#crt{position:absolute;inset:0;pointer-events:none;opacity:.35;mix-blend-mode:multiply;background:repeating-linear-gradient(0deg,rgba(0,0,0,.35) 0 calc(var(--s)*.34px),transparent calc(var(--s)*.34px) calc(var(--s)*1px))}
#label{position:absolute;top:calc(var(--s)*3px);left:0;right:0;text-align:center;font-size:calc(var(--s)*9px);
  color:var(--ink);text-shadow:0 calc(var(--s)*1px) 0 #000,calc(var(--s)*1px) 0 0 #000,calc(var(--s)*-1px) 0 0 #000}
#dialog{position:absolute;left:3%;right:3%;bottom:4%;display:none;
  background:linear-gradient(180deg,rgba(28,23,50,.97),rgba(12,10,26,.97));
  border:calc(var(--s)*1px) solid var(--line);
  box-shadow:0 0 0 calc(var(--s)*1px) #000,0 calc(var(--s)*2px) calc(var(--s)*8px) rgba(0,0,0,.55),inset 0 calc(var(--s)*1px) 0 rgba(255,255,255,.07);
  padding:calc(var(--s)*3px) calc(var(--s)*6px) calc(var(--s)*4px);font-size:calc(var(--s)*8px);line-height:1.1;
  text-shadow:0 calc(var(--s)*.6px) 0 rgba(0,0,0,.6)}
#dialog.enter{animation:dlgIn .22s cubic-bezier(.2,.9,.3,1.2)}
@keyframes dlgIn{from{transform:translateY(calc(var(--s)*6px)) scale(.985);opacity:0}to{transform:none;opacity:1}}
/* fala dos óculos: azul-ciano, com brilho e linhas de varredura */
#dialog.glass{background:linear-gradient(180deg,rgba(6,38,58,.97),rgba(3,18,34,.97));border-color:#5fe0ff;
  box-shadow:0 0 0 calc(var(--s)*1px) #02121f,0 0 calc(var(--s)*9px) rgba(95,224,255,.5),inset 0 0 calc(var(--s)*9px) rgba(95,224,255,.14);
  text-shadow:0 0 calc(var(--s)*2px) rgba(95,224,255,.45)}
#dialog.glass::before{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(95,224,255,.07) 0 calc(var(--s)*.5px),transparent calc(var(--s)*.5px) calc(var(--s)*1.5px))}
#dialog.glass .who{color:#5fe0ff;letter-spacing:calc(var(--s)*.4px)}
#dialog.glass .txt{color:#d6f7ff}
#dialog.glass.done::after{color:#5fe0ff}
#dialog .who{display:block;color:var(--accent);font-size:.9em;margin-bottom:calc(var(--s)*.5px)}
#dialog.narr .who{display:none}
#dialog.narr .txt{color:var(--muted)}
#dialog.done::after{content:"▼";position:absolute;right:calc(var(--s)*4px);bottom:calc(var(--s)*2px);
  font-size:.7em;color:var(--accent);animation:blink 1s steps(2) infinite}
#menu{position:absolute;inset:0;text-align:center}
#menu .title{position:relative;left:calc(var(--axis) - 50%);margin-top:calc(var(--s)*11px);font-size:calc(var(--s)*17px);letter-spacing:calc(var(--s)*1px);color:var(--ink);line-height:1;
  text-shadow:calc(var(--s)*1px) calc(var(--s)*1px) 0 #8a3a2a,calc(var(--s)*2px) calc(var(--s)*2px) 0 #3a1414,calc(var(--s)*3px) calc(var(--s)*3px) 0 #000}
#menu .sub{position:relative;left:calc(var(--axis) - 50%);font-size:calc(var(--s)*5.5px);color:#a9b8d9;margin-top:calc(var(--s)*1px);letter-spacing:calc(var(--s)*.3px);text-shadow:0 calc(var(--s)*1px) 0 #000}
#menu .hint{position:absolute;left:calc(var(--axis) - 50%);right:calc(50% - var(--axis));bottom:calc(var(--s)*2px);font-size:calc(var(--s)*4.5px);color:#6a6488;animation:blink 1.4s steps(2) infinite}
#menu.hide{display:none}
/* botões e painéis em pixel: as quatro sombras de 1 px fazem o canto "serrilhado" */
.pxbtn,.pxnav{pointer-events:auto;cursor:pointer;font-family:'VT323',ui-monospace,monospace;border:0;line-height:1;image-rendering:pixelated}
.pxbtn{position:absolute;left:var(--axis);top:calc(var(--s)*112px);transform:translateX(-50%);font-size:calc(var(--s)*10px);color:#1b1726;background:#e8b04a;
  padding:calc(var(--s)*2px) calc(var(--s)*9px) calc(var(--s)*3px);
  box-shadow:0 calc(var(--s)*-1px) 0 0 #1b1726,0 calc(var(--s)*1px) 0 0 #1b1726,calc(var(--s)*-1px) 0 0 0 #1b1726,calc(var(--s)*1px) 0 0 0 #1b1726,
    inset 0 calc(var(--s)*-2px) 0 0 #a8742a,inset 0 calc(var(--s)*1px) 0 0 #ffe7a0,0 calc(var(--s)*3px) 0 0 #000}
.pxbtn:hover{background:#ffc35a}
.pxbtn:active{transform:translateX(-50%) translateY(calc(var(--s)*2px));box-shadow:0 calc(var(--s)*-1px) 0 0 #1b1726,0 calc(var(--s)*1px) 0 0 #1b1726,calc(var(--s)*-1px) 0 0 0 #1b1726,calc(var(--s)*1px) 0 0 0 #1b1726,inset 0 calc(var(--s)*1px) 0 0 #a8742a}
.pxbtn.sm{position:static;transform:none;font-size:calc(var(--s)*7px);padding:calc(var(--s)*1px) calc(var(--s)*6px) calc(var(--s)*2px);margin-top:calc(var(--s)*5px)}
.pxbtn.sm:active{transform:translateY(calc(var(--s)*1px))}
.mnav{position:absolute;top:calc(var(--s)*3px);right:calc(var(--s)*4px);display:flex;justify-content:flex-end;gap:calc(var(--s)*3px)}
.pxnav{font-size:calc(var(--s)*5px);color:#e9e4f8;background:#1b1830;padding:calc(var(--s)*1px) calc(var(--s)*4px) calc(var(--s)*1.5px);
  box-shadow:0 calc(var(--s)*-1px) 0 0 #5b4d7d,0 calc(var(--s)*1px) 0 0 #5b4d7d,calc(var(--s)*-1px) 0 0 0 #5b4d7d,calc(var(--s)*1px) 0 0 0 #5b4d7d}
.pxnav:hover,.pxnav.on{background:#e8b04a;color:#1b1726}
.pxpanel{position:absolute;right:calc(var(--s)*4px);width:58%;top:calc(var(--s)*14px);display:none;pointer-events:auto;background:rgba(14,12,26,.97);
  padding:calc(var(--s)*5px) calc(var(--s)*8px) calc(var(--s)*6px);text-align:center;
  box-shadow:0 calc(var(--s)*-1px) 0 0 #e8b04a,0 calc(var(--s)*1px) 0 0 #e8b04a,calc(var(--s)*-1px) 0 0 0 #e8b04a,calc(var(--s)*1px) 0 0 0 #e8b04a,0 calc(var(--s)*3px) 0 0 #000}
.pxpanel.open{display:block}
.pxpanel .ph{font-size:calc(var(--s)*10px);color:#e8b04a;margin-bottom:calc(var(--s)*3px)}
.pxpanel .pb{font-size:calc(var(--s)*7px);color:var(--ink);line-height:1.15}
.pxpanel .pb ul{list-style:none;margin:0;padding:0}
.pxpanel .pb li{margin:calc(var(--s)*1px) 0}
.pxpanel .pb li::before{content:"▸ ";color:#e8b04a}
#choices{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--s)*5px);background:rgba(7,6,13,.9);pointer-events:auto;text-align:center}
#choices .q{font-size:calc(var(--s)*9px);color:var(--accent)}
#choices button{font:inherit;font-size:calc(var(--s)*8px);color:var(--ink);background:var(--box);border:calc(var(--s)*1px) solid var(--line);padding:calc(var(--s)*3px) calc(var(--s)*6px);width:92%;cursor:pointer;line-height:1.1}
#choices button:hover{border-color:var(--accent);color:var(--accent)}
#advice{position:absolute;left:calc(var(--s)*3px);top:calc(var(--s)*3px);max-width:46%;display:none;background:linear-gradient(180deg,rgba(6,38,58,.88),rgba(3,18,34,.88));box-shadow:0 0 calc(var(--s)*6px) rgba(95,224,255,.35);backdrop-filter:blur(calc(var(--s)*.6px));border:calc(var(--s)*1px) solid #5fe0ff;color:#bff3ff;padding:calc(var(--s)*2px) calc(var(--s)*3px);font-size:calc(var(--s)*6px);line-height:1.05;text-align:left}
#chat{position:absolute;inset:0;display:none;flex-direction:column;gap:calc(var(--s)*3px);padding:calc(var(--s)*5px);box-sizing:border-box;background:rgba(7,10,18,.95);pointer-events:auto;overflow:auto;font-size:calc(var(--s)*7px);line-height:1.1;text-align:left}
#chat .ct{color:#5fe0ff;font-size:1.15em}
#cp{border:calc(var(--s)*1px) solid #5fe0ff;padding:calc(var(--s)*3px);min-height:calc(var(--s)*24px);color:var(--ink)}
#cf{display:flex;flex-wrap:wrap;gap:calc(var(--s)*2px)}
#chat button{font:inherit;color:var(--ink);background:var(--box);border:calc(var(--s)*1px) solid var(--line);padding:calc(var(--s)*1.5px) calc(var(--s)*3px);cursor:pointer;line-height:1.1}
#chat button:hover{border-color:#5fe0ff;color:#5fe0ff}
#cr{color:var(--accent);min-height:1.2em}
#pov{position:absolute;inset:0;display:none;pointer-events:auto;cursor:pointer}
#povL,#povR{position:absolute;top:calc(var(--s)*8px);background:rgba(6,22,32,.74);border:calc(var(--s)*1px) solid rgba(95,224,255,.7);color:#bff3ff;padding:calc(var(--s)*3px);font-size:calc(var(--s)*5.5px);line-height:1.12;text-align:left;overflow:hidden;max-height:calc(var(--s)*92px);box-sizing:border-box}
#povL{left:calc(var(--s)*8px);width:46%} #povR{right:calc(var(--s)*8px);width:34%}
#pov .ph{color:#5fe0ff;margin-bottom:calc(var(--s)*2px);font-size:1.1em}
#povU{color:var(--ink)} #povA{color:var(--accent);margin-top:calc(var(--s)*3px);display:none}
#povH{color:#5fe0ff;margin-top:calc(var(--s)*2px);display:none;animation:blink 1s steps(2) infinite}
#povMem{margin:0;padding:0;list-style:none} #povMem li{color:#5a7a88;margin-bottom:calc(var(--s)*1.5px)}
#povMem li.on{color:#bff3ff} #povMem li.on::before{content:"✓ ";color:#7fd6a0}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion: reduce){ #menu .hint,#dialog.done::after{animation:none} }
#gbtn{position:absolute;right:calc(var(--s)*3px);top:calc(var(--s)*10px);display:none;align-items:center;gap:calc(var(--s)*1.5px);
  pointer-events:auto;cursor:pointer;background:rgba(7,10,18,.78);border:calc(var(--s)*1px) solid #3a4a66;color:#7f8fb0;
  padding:calc(var(--s)*1.5px) calc(var(--s)*2.5px);font:inherit;font-size:calc(var(--s)*6px);line-height:1}
#gbtn svg{width:calc(var(--s)*14px);height:auto;display:block}
#gbtn .lens{fill:#0a0d16}
#gbtn.on{border-color:#5fe0ff;color:#5fe0ff;box-shadow:0 0 calc(var(--s)*3px) rgba(95,224,255,.6)}
#gbtn.on .lens{fill:#5fe0ff}
#flb,#frb{position:absolute;bottom:calc(var(--s)*5px);display:none;pointer-events:auto;cursor:pointer;background:rgba(10,12,24,.8);border:calc(var(--s)*1px) solid #9aa0c8;color:#e9e4f8;padding:calc(var(--s)*2px) calc(var(--s)*4px);font:inherit;font-size:calc(var(--s)*8px);line-height:1;touch-action:none}
#flb{left:calc(var(--s)*3px)} #frb{left:calc(var(--s)*24px)}
#fbtn{position:absolute;right:calc(var(--s)*3px);bottom:calc(var(--s)*5px);display:none;pointer-events:auto;cursor:pointer;background:rgba(40,10,12,.85);border:calc(var(--s)*1px) solid #ff8a6a;color:#ffd2c0;padding:calc(var(--s)*2px) calc(var(--s)*4px);font:inherit;font-size:calc(var(--s)*7px);line-height:1}
/* ---------- tela cheia ---------- */
#fsbtn{position:absolute;left:calc(var(--s)*3px);top:calc(var(--s)*3px);z-index:5;pointer-events:auto;cursor:pointer;font-family:'VT323',monospace;
  font-size:calc(var(--s)*8px);line-height:1;color:#e9e4f8;background:rgba(14,12,26,.7);border:0;padding:0 calc(var(--s)*2px);
  box-shadow:0 calc(var(--s)*-1px) 0 0 #5b4d7d,0 calc(var(--s)*1px) 0 0 #5b4d7d,calc(var(--s)*-1px) 0 0 0 #5b4d7d,calc(var(--s)*1px) 0 0 0 #5b4d7d}
#fsbtn:hover{color:#1b1726;background:#e8b04a}
#fsbtn.off{display:none}
:fullscreen body,:-webkit-full-screen body{background:#000}
/* ---------- controles de toque (estilo console portátil) ---------- */
#touch{display:none;position:fixed;inset:0;pointer-events:none;z-index:20;--b:clamp(34px,10vmin,56px)}
html.touch #touch.on{display:block}
#touch button{pointer-events:auto;touch-action:none;-webkit-user-select:none;user-select:none;font-family:'VT323',monospace;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
#touch .dpad{position:absolute;left:max(12px,env(safe-area-inset-left));bottom:max(12px,env(safe-area-inset-bottom));width:calc(var(--b)*3);height:calc(var(--b)*3);opacity:.8}
#touch .dpad button,#touch .dpad .c{position:absolute;width:var(--b);height:var(--b);background:#2a2838;color:#9a96b0;font-size:calc(var(--b)*.45);
  box-shadow:inset 0 -4px 0 #15131e,inset 0 2px 0 #3e3a52}
#touch .dpad .c{left:var(--b);top:var(--b);box-shadow:none}
#touch .dpad .u{left:var(--b);top:0;border-radius:6px 6px 0 0;opacity:.45}
#touch .dpad .d{left:var(--b);top:calc(var(--b)*2);border-radius:0 0 6px 6px}
#touch .dpad .l{left:0;top:var(--b);border-radius:6px 0 0 6px}
#touch .dpad .r{left:calc(var(--b)*2);top:var(--b);border-radius:0 6px 6px 0}
#touch .ab{position:absolute;right:max(14px,env(safe-area-inset-right));bottom:max(14px,env(safe-area-inset-bottom));width:calc(var(--b)*2.9);height:calc(var(--b)*2.4);opacity:.85}
#touch .ab button{position:absolute;width:calc(var(--b)*1.25);height:calc(var(--b)*1.25);border-radius:50%;color:#fff;font-size:calc(var(--b)*.5);line-height:1;
  display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:inset 0 -5px 0 rgba(0,0,0,.35),0 3px 0 #000}
#touch .ab small{font-size:calc(var(--b)*.2);opacity:.85;margin-top:2px}
#touch .ab .a{right:0;top:0;background:#b8323a}
#touch .ab .b{left:0;bottom:0;background:#2a6aa8}
#touch button.down{filter:brightness(1.35);transform:translateY(2px)}
/* ---------- celular em pé ---------- */
#rotate{display:none;position:fixed;inset:0;z-index:30;background:#07060d;color:#f1e6c8;font-family:'VT323',monospace;font-size:26px;
  flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:8px}
#rotate .ico{font-size:64px;color:#e8b04a;animation:spin 2.4s steps(8) infinite}
#rotate small{font-size:16px;color:#6a6488;margin-top:14px}
@keyframes spin{to{transform:rotate(360deg)}}
@media (orientation: portrait){ html.touch:not(.portrait-ok) #rotate{display:flex} }


/* pós-processamento em CSS (gradação, vinheta e granulado), só durante o jogo */
#fxgrade,#fxvig,#fxgrain{position:absolute;inset:0;pointer-events:none;display:none}
#game.fx #fxgrade,#game.fx #fxvig{display:block}
#game.fx:not(.lite) #fxgrain{display:block}
#fxgrade{mix-blend-mode:soft-light;background:linear-gradient(var(--fx-top,transparent),var(--fx-bottom,transparent))}
#fxvig{opacity:var(--fx-vig,.55);background:radial-gradient(circle calc(var(--s)*137px) at 50% 50%,rgba(0,0,0,0) calc(var(--s)*46px),#000 calc(var(--s)*137px))}
#fxgrain{mix-blend-mode:overlay;opacity:.05;background-image:var(--grain);background-size:calc(var(--s)*40px) calc(var(--s)*40px);animation:grainmv .5s steps(1) infinite}
@keyframes grainmv{0%{background-position:0 0}20%{background-position:37% 61%}40%{background-position:-23% 14%}60%{background-position:71% -32%}80%{background-position:-48% 83%}}
@media (prefers-reduced-motion: reduce){#fxgrain{animation:none}}
</style>
</head>

  function schedMusic() {
    if (!mus) return;
    const beat = 60 / 66;
    while (mus.next < gameState.audioCtx.currentTime + 0.4) {
      const [m, b] = MEL[mus.i % MEL.length], dur = b * beat;

  function violinNote(m, t0, dur) {
    const f = 440 * Math.pow(2, (m - 69) / 12);
    const o = gameState.audioCtx.createOscillator();
    o.type = "sawtooth";
    o.frequency.value = f;
    const o2 = gameState.audioCtx.createOscillator();
    o2.type = "triangle";
    o2.frequency.value = f * 1.003;
    const lfo = gameState.audioCtx.createOscillator();
    lfo.frequency.value = 5.5;
    const lg = gameState.audioCtx.createGain();
    lg.gain.setValueAtTime(0, t0);
    lg.gain.linearRampToValueAtTime(f * 0.012, t0 + 0.35);
    lfo.connect(lg);
    lg.connect(o.frequency);
    lg.connect(o2.frequency);
    const flt = gameState.audioCtx.createBiquadFilter();
    flt.type = "lowpass";
    flt.frequency.value = 1800;
    flt.Q.value = 0.8;
    const g = gameState.audioCtx.createGain();
    g.gain.setValueAtTime(0, t0);
    g.gain.linearRampToValueAtTime(0.22, t0 + 0.09);
    g.gain.setValueAtTime(0.2, Math.max(t0 + 0.1, t0 + dur - 0.12));
    g.gain.linearRampToValueAtTime(0, t0 + dur + 0.05);
    o.connect(flt);
    o2.connect(flt);
    flt.connect(g);
    g.connect(mus.master);
    [o, o2, lfo].forEach((x) => {
      x.start(t0);
      x.stop(t0 + dur + 0.1);
    });
  }

    P.tx = null;
    P.pending = null;
    F.tr.forEach((s) => s.t -= dt);
    F.tr = F.tr.filter((s) => s.t > 0);

    if (F.hurt > 0) F.hurt -= dt;

    } else if (c.st === "out") {
      c.x += Math.sign(FX.cop.out - c.x) * Math.min(Math.abs(FX.cop.out - c.x), 120 * dt);
      if (c.tm <= 0.35 && !c.shot) {
        c.shot = true;
        const tg = F.b.find(bExposed) || F.b.find((b) => b.st !== "down");
        if (tg) {
          const hit2 = bExposed(tg) && Math.random() < 0.18;
          F.tr.push({ x0: c.x - 2, y0: 100, x1: tg.x + 6, y1: hit2 ? 108 : 112, t: 0.08, c: "#ffe7a0", spark: hit2 ? 0 : 1 });

          if (!hit2) ricochet(0.06);
          if (hit2) {
            tg.hp--;
            tg.st = tg.hp <= 0 ? "down" : "hurt";
            tg.tm = 0.45;
            if (F.b.every((x) => x.st === "down")) {
              fightWin();
              return;

      if (c.tm <= 0) {

      }
    } else if (c.st === "back") {
      const d = FX.cop.hide - c.x;
      c.x += Math.sign(d) * Math.min(Math.abs(d), 120 * dt);
      if (Math.abs(d) < 1) {
        c.st = "hide";

    }
    const aiming = F.b.some((b) => b.st === "aim" || b.st === "step");
    for (const b of F.b) {
      if (b.st === "down") continue;
      b.tm -= dt;
      if (b.st === "hide" && b.tm <= 0) {
        if (aiming && Math.random() < 0.6) b.tm = 0.5;
        else {
          b.st = "step";
        }
      } else if (b.st === "step") {
        const d = b.ox - b.x;
        b.x += Math.sign(d) * Math.min(Math.abs(d), 110 * dt);
        if (Math.abs(d) < 1) {
          b.st = "aim";
          b.tm = 0.85;
          b.tg = c.st === "out" && Math.random() < 0.35 ? "cop" : "det";
        }
      } else if (b.st === "aim" && b.tm <= 0) {
        gunshot("bandit");
        if (b.tg === "cop" || !F.out) ricochet(0.07);
        if (b.tg === "cop") {
          F.tr.push({ x0: b.x + 16, y0: 110, x1: c.x + 6, y1: 98, t: 0.1, c: "#ff8a6a", spark: 1 });
          c.st = "back";
          c.shot = false;
        } else if (F.out) {
          F.hp--;
          F.hurt = 0.5;
          state2.run.shake = 0.35;
          F.out = false;
          F.tr.push({ x0: b.x + 16, y0: 110, x1: P.x, y1: 118, t: 0.1, c: "#ff8a6a" });
        } else F.tr.push({ x0: b.x + 16, y0: 110, x1: C2COV[3].x + 4, y1: 124, t: 0.1, c: "#ff8a6a", spark: 1 });
        b.st = "rec";
        b.tm = 0.35;
        if (F.hp <= 0) {
          fightLose();
          return;
        }
      } else if ((b.st === "rec" || b.st === "hurt") && b.tm <= 0) {
        b.st = "back";
      } else if (b.st === "back") {
        const d = b.hx - b.x;
        b.x += Math.sign(d) * Math.min(Math.abs(d), 110 * dt);
        if (Math.abs(d) < 1) {
          b.st = "hide";
          b.tm = 1 + Math.random() * 1.4;
        }
      }
    }
  }

    if (state3.run.phase === "corr" && !busy) {
      state3.run.ct += dt;
      for (const o of OBST) {
        if (o.k === "low" && !(state3.run.crouch || state3.run.crouchHold) && P.x > o.x - 8 && P.x < o.x + o.w) {
          if (state3.run.px <= o.x - 8) {
            P.x = o.x - 8;
            state3.run.blockT = 0.8;
          } else state3.run.crouch = true;
        }
        if ((o.k === "steam" || o.k === "spark") && steamOn(o) && P.x > o.x - 3 && P.x < o.x + o.w + 3 && state3.run.stun <= 0) {
          state3.run.stun = 0.6;
          P.x = o.x - 14;
          state3.run.shake = 0.25;
          noiseBurst(0.3, 0.15, o.k === "spark" ? 4e3 : 900, 300);
        }
      }
      if (state3.run.blockT > 0) state3.run.blockT -= dt;
      // primeiro ele esmurra a porta por onde o detetive entrou; depois a arrebenta e vem atrás
      const r3 = state3.run;
      for (const [tk, n] of [[0.5, 1], [1.05, 2], [1.5, 3]]) if (r3.ct > tk && (r3.knocks || 0) < n) { r3.knocks = n; r3.doorShake = 0.3; doorKnock(); state3.run.shake = 0.15; }
      if (r3.doorShake > 0) r3.doorShake -= dt;
      if (r3.ct > 2.0) {
        if (!G.on) {
          G.on = true;
          G.x = 8;
          r3.doorBroken = true;
          r3.debris = Array.from({ length: 14 }, () => ({ x: 8, y: 70 + Math.random() * 50, vx: 30 + Math.random() * 90, vy: -40 + Math.random() * 30, s: 1 + Math.random() * 2, t: 0 }));
          state3.run.flk = 0.6;
          state3.run.shake = 0.5;
          doorCrash();
          screamSound();
        }
        G.x += 48 * dt;
        if (Math.abs(G.x - P.x) < 8) c3Caught("corr");
      }
      if (P.x > 730) {
        enterRoom();
      }
      state3.run.px = P.x;
      return;
    }
    state3.run.px = P.x;
  }
  function c3DoorTarget() {
    if (gameState.caseIndex !== 2 || !state3.run || state3.run.phase !== "hunt") return null;
    const left = (s) => state3.run.hs[s].some((x) => x.clue && x.n === 0);
    let go = null;
    if (gameState.caseSolved) {
      if (state3.run.sec === "w1") go = "Vagão 2";
      else if (state3.run.sec === "w2") go = "Armário de manutenção";
    } else if (state3.run.sec === "w1" && left("w2")) go = "Vagão 2";
    else if (state3.run.sec === "w2" && left("w1")) go = "Vagão 1";
    return go ? gameState.hotspots.find((x) => x.name === go) || null : null;
  }
